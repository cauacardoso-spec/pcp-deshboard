
<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Central de Inteligência Operacional | PCP</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #081221;
  color: #edf5ff;
  font-family: Segoe UI, Arial, sans-serif;
}
header {
  padding: 45px 8%;
  background: #101e32;
  border-bottom: 1px solid #2b405b;
}
h1 { font-size: 36px; }
header p { color: #9bb0cc; }
main {
  max-width: 1200px;
  margin: 50px auto;
  padding: 0 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}
.card {
  display: block;
  padding: 30px;
  background: #14243b;
  border: 1px solid #34516f;
  border-radius: 16px;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}
.card:hover {
  transform: translateY(-5px);
  border-color: #65b5fa;
}
.icon { font-size: 36px; }
.card h2 { margin-top: 25px; }
.card p { color: #9bb0cc; }
</style>
</head>
<body>
<header>
  <p>GESTÃO À VISTA • PCP</p>
  <h1>Central de Inteligência Operacional</h1>
  <p>Acompanhamento e planejamento da produção</p>
</header>

<main>
<div class="grid">
  <a class="card" href="torre-de-controle.html">
    <div class="icon">🏭</div>
    <h2>Torre de Controle</h2>
    <p>Obras, status, produtos e entregas.</p>
  </a>

  <a class="card" href="-de-obras.html">
    <div class="icon">📊</div>
    <h2>Levantamento de Obras</h2>
    <p>Apontamentos, divergências e urgências.</p>
  </a>

  <a class="card" href="planejamento.html">
    <div class="icon">📅</div>
    <h2>Planejamento PCP</h2>
    <p>Programação diária, semanal e mensal.</p>
  </a>
</div>
</main>
</body>
</html>
